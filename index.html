<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Hire — Jobs that fit your student life</title>
<meta name="description" content="Student-first, schedule-aware job matching with transparent fit scores.">
<style>
:root{--bg:#07111f;--p:#0d1b2e;--p2:#12243a;--t:#f4f8fd;--m:#9fb0c4;--l:#273b54;--g:#61dfad;--b:#7aaaff;--y:#ffc76b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:radial-gradient(900px 600px at 90% 0,rgba(122,170,255,.13),transparent 60%),linear-gradient(#06101d,#081526);color:var(--t);min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}.nav{position:sticky;top:0;z-index:10;background:#06101ddd;border-bottom:1px solid var(--l);backdrop-filter:blur(14px)}.navin{max-width:1180px;margin:auto;padding:13px 20px;display:flex;justify-content:space-between;gap:16px;align-items:center}.brand{font-weight:900;display:flex;gap:9px;align-items:center}.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--g),var(--b));color:#04121c}.beta,.pill{font-size:11px;border:1px solid var(--l);padding:5px 8px;border-radius:999px;color:#cbd8e6}.tabs{display:flex;flex-wrap:wrap;gap:6px}.tab{border:1px solid transparent;background:transparent;color:var(--m);padding:8px 10px;border-radius:10px}.tab:hover,.tab.on{background:var(--p);border-color:var(--l);color:white}.wrap{max-width:1180px;margin:auto;padding:28px 20px 70px}.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:16px}.card{border:1px solid var(--l);background:linear-gradient(180deg,var(--p),#0a1728);border-radius:20px;padding:22px}.hero .card:first-child{padding:32px}.eyebrow{color:var(--g);font-weight:900;letter-spacing:.13em;text-transform:uppercase;font-size:11px}h1{font-size:clamp(40px,6vw,70px);letter-spacing:-.055em;line-height:.95;margin:10px 0 14px}h2{margin:0 0 8px;letter-spacing:-.025em}p{color:var(--m);line-height:1.55}.lead{font-size:18px;max-width:760px}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.btn{border:0;background:linear-gradient(135deg,var(--g),#78efc0);color:#04121c;font-weight:900;padding:10px 14px;border-radius:11px}.btn.alt{background:var(--p2);color:white;border:1px solid var(--l)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{border:1px solid var(--l);background:var(--p);border-radius:16px;padding:16px}.stat b{display:block;font-size:28px}.stat span{font-size:11px;color:var(--m)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.jobs{display:grid;gap:10px}.job{border:1px solid var(--l);background:var(--p2);border-radius:15px;padding:15px}.jobtop{display:flex;justify-content:space-between;gap:12px}.score{min-width:66px;text-align:center;color:var(--g);font-weight:900;font-size:20px;border:1px solid #61dfad55;background:#61dfad12;border-radius:12px;padding:7px}.small{font-size:12px;color:var(--m)}.meta{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}.why{color:#87eeb1;font-size:12px}.warn{color:var(--y);font-size:12px}.progress{height:7px;border:1px solid var(--l);border-radius:999px;overflow:hidden}.progress div{height:100%;background:linear-gradient(90deg,var(--b),var(--g))}.factor{margin:10px 0}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:5px}.full{grid-column:1/-1}label{font-size:12px;font-weight:800;color:#d8e3ef}input,textarea,select{width:100%;background:#081526;border:1px solid var(--l);color:white;border-radius:10px;padding:10px}textarea{min-height:100px}.notice{border:1px solid #7aaaff44;background:#7aaaff10;border-radius:12px;padding:12px 14px;color:#d8e6ff}.tools{display:grid;grid-template-columns:220px 1fr;gap:14px}.toolmenu{display:grid;gap:7px}.tool{background:#081526;border:1px solid var(--l);color:#cad7e5;border-radius:10px;padding:9px;text-align:left}.tool.on{border-color:var(--g);color:white}.output{white-space:pre-wrap;min-height:290px;background:#081526;border:1px solid var(--l);border-radius:12px;padding:14px;color:#dce6ef;line-height:1.55}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid var(--l);text-align:left;font-size:12px}.footer{text-align:center;color:var(--m);font-size:11px;margin-top:30px}@media(max-width:800px){.hero,.grid,.tools,.form{grid-template-columns:1fr}.full{grid-column:auto}.navin{align-items:flex-start;flex-direction:column}}
</style></head><body>
<div class="nav"><div class="navin"><div class="brand"><div class="logo">SH</div>Student Hire <span class="beta">Beta</span></div><div class="tabs" id="tabs"></div></div></div>
<main class="wrap" id="app"></main><div class="footer">Student Hire beta · Jobs that fit your student life.</div>
<script>
const jobs=[
{id:1,title:"Part-Time Marketing Assistant",company:"Northside Studio",loc:"Toronto",pay:22,hours:15,mode:"Hybrid",skills:["social media","excel","communication"],score:96,why:"Evening-friendly, strong skill overlap, target pay met.",gap:"No major gaps flagged."},
{id:2,title:"Campus Brand Ambassador",company:"LaunchLoop",loc:"Toronto",pay:20,hours:10,mode:"In person",skills:["communication","social media"],score:91,why:"Flexible around classes and highly student-friendly.",gap:"Some daytime availability may be needed."},
{id:3,title:"Junior Operations Coordinator",company:"CityCart",loc:"Toronto",pay:24,hours:20,mode:"Hybrid",skills:["excel","customer service"],score:88,why:"Strong pay, skills, hours and commute fit.",gap:"Upper end of weekly-hours preference."},
{id:4,title:"Social Media Assistant",company:"Harbour & Co.",loc:"Toronto",pay:19,hours:12,mode:"Remote",skills:["social media","communication"],score:86,why:"Remote, flexible and aligned with marketing interests.",gap:"Pay is close to minimum target."},
{id:5,title:"Retail Associate",company:"Union Market",loc:"Toronto",pay:18.5,hours:16,mode:"In person",skills:["customer service"],score:79,why:"Good schedule and customer-service match.",gap:"Less aligned with long-term career interests."},
{id:6,title:"Finance Admin Assistant",company:"Bayview Credit",loc:"Toronto",pay:21,hours:24,mode:"In person",skills:["excel","data entry"],score:72,why:"Pay and Excel skills fit.",gap:"Hours exceed preferred range and daytime schedule may conflict."}
];
const P={name:"",school:"Toronto Metropolitan University",program:"Business Management",location:"Toronto, ON",hours:"8–20",pay:18,availability:"Weekdays after 4 PM and weekends",skills:"Excel, communication, customer service, social media",threshold:85};
try{Object.assign(P,JSON.parse(localStorage.getItem("shp")||"{}"))}catch{}
let apps=[];try{apps=JSON.parse(localStorage.getItem("sha")||"[]")}catch{}
let tab="Matches",selected=jobs[0],tool="Should I Apply?";
const tabs=["Matches","Profile","AI Coach","Applications","Feedback","Why Student Hire"];\nconst tabsEl=document.getElementById("tabs");\nconst app=document.getElementById("app");
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function nav(){tabsEl.innerHTML=tabs.map(x=>`<button class="tab ${x===tab?"on":""}" onclick="go('${x}')">${x}</button>`).join("")}
function go(x){tab=x;render()}
function saveP(k,v){P[k]=v;localStorage.setItem("shp",JSON.stringify(P))}
function track(j,status="Saved"){const x=apps.find(a=>a.id===j.id);if(x)x.status=status;else apps.push({id:j.id,title:j.title,company:j.company,score:j.score,status});localStorage.setItem("sha",JSON.stringify(apps));render()}
function matches(){const high=jobs.filter(j=>j.score>=P.threshold).length;return `<section class="hero"><div class="card"><div class="eyebrow">Student-first job matching</div><h1>Jobs that fit your student life.</h1><p class="lead">Student Hire scores jobs against class schedules, commute, weekly hours, pay, skills, career interests and student-friendliness — then explains the score.</p><div class="row"><button class="btn" onclick="document.getElementById('jobs').scrollIntoView()">Find my matches</button><button class="btn alt" onclick="go('Profile')">Build my profile</button><span class="pill">Alerts only at ${P.threshold}%+</span></div></div><div class="stats"><div class="stat"><b>${jobs.length}</b><span>sample jobs scored</span></div><div class="stat"><b>${high}</b><span>above alert threshold</span></div><div class="stat"><b>9</b><span>fit factors</span></div><div class="stat"><b>${apps.length}</b><span>applications tracked</span></div></div></section>
<div class="grid" id="jobs"><section class="card"><h2>Your matches</h2><p class="small">Demo jobs · real Jooble Canada feed plugs in later.</p><div class="jobs">${jobs.map(j=>`<article class="job" onclick='selected=jobs.find(x=>x.id===${j.id});render()'><div class="jobtop"><div><b>${j.title}</b><div class="small">${j.company} · ${j.loc}</div></div><div class="score">${j.score}%</div></div><div class="meta"><span class="pill">$${j.pay}/hr</span><span class="pill">${j.hours} hrs/wk</span><span class="pill">${j.mode}</span></div><div class="why">✓ ${j.why}</div><div class="warn">△ ${j.gap}</div><div class="row" style="margin-top:10px"><button class="btn alt" onclick="event.stopPropagation();track(jobs.find(x=>x.id===${j.id}))">Save</button><button class="btn" onclick="event.stopPropagation();selected=jobs.find(x=>x.id===${j.id});tool='Should I Apply?';go('AI Coach')">Ask AI</button></div></article>`).join("")}</div></section><section class="card"><h2>Why this fits</h2><div class="score" style="margin-bottom:12px">${selected.score}%</div><h3>${selected.title}</h3><p>${selected.why}</p>${[["Schedule",selected.score],["Skills",Math.min(100,selected.score+2)],["Career interests",Math.max(60,selected.score-4)],["Commute",Math.min(100,selected.score+1)],["Hours",Math.max(55,selected.score-3)],["Pay",Math.min(100,selected.score+4)],["Student-friendly",Math.min(100,selected.score+3)]].map(x=>`<div class="factor"><div class="row" style="justify-content:space-between"><span class="small">${x[0]}</span><span class="small">${x[1]}%</span></div><div class="progress"><div style="width:${x[1]}%"></div></div></div>`).join("")}<p class="small">Ranking uses job-relevant preferences and qualifications, not protected traits.</p></section></div>`}
function profile(){return `<section class="card"><h2>Your Student Hire profile</h2><p>One profile powers matching, AI coaching and high-fit alerts. Saved only in this browser for this beta.</p><div class="form">
${[["Name","name"],["School","school"],["Program","program"],["Location","location"],["Desired hours/week","hours"],["Minimum hourly pay","pay"],["Availability / class schedule","availability"],["Skills","skills"]].map(([l,k])=>`<div class="field ${k==="availability"||k==="skills"?"full":""}"><label>${l}</label>${k==="availability"?`<textarea oninput="saveP('${k}',this.value)">${esc(P[k])}</textarea>`:`<input value="${esc(P[k])}" oninput="saveP('${k}',this.value)">`}</div>`).join("")}
<div class="field full"><label>High-fit alert threshold</label><input type="range" min="60" max="100" value="${P.threshold}" oninput="saveP('threshold',Number(this.value));this.nextElementSibling.textContent=this.value+'% and above'"><div class="small">${P.threshold}% and above</div></div></div><div class="row" style="margin-top:14px"><button class="btn" onclick="go('Matches')">Use this profile</button></div></section>`}
function ai(){const tools=["Resume Review","Profile Autofill","Should I Apply?","Interview Prep","Tailored Cover Letter","Skill-Gap Plan","Application Answers","Networking Message","Study/Work Compatibility","Scam/Risk Check"];return `<section class="card"><h2>AI Career Copilot</h2><p>Demo mode now; production can connect through a server-side AI key.</p><div class="tools"><div class="toolmenu">${tools.map(x=>`<button class="tool ${x===tool?"on":""}" onclick="tool='${x}';render()">${x}</button>`).join("")}</div><div><div class="output" id="out">Select a tool and run it for <b>${selected.title}</b>.</div><div class="row" style="margin-top:10px"><button class="btn" onclick="runAI()">Run AI tool</button></div><p class="small">Student Hire AI should never invent experience, credentials or employer facts.</p></div></div></section>`}
function runAI(){const o=document.getElementById("out");const base={ "Should I Apply?":`Yes — this is a ${selected.score}% match. Strongest reasons: ${selected.why} Main caution: ${selected.gap}`, "Interview Prep":`Prepare 3 examples showing communication, reliability and student-time management. Be ready to explain your availability clearly and ask how shifts are scheduled around exams.`, "Resume Review":`Lead with measurable student-friendly experience, Excel/communication skills, availability and any customer-facing work. Keep bullets outcome-focused and do not add skills you cannot defend in an interview.`, "Skill-Gap Plan":`Gap to close: ${selected.gap} Build one proof point this week: a small project, course exercise or volunteer example tied to the role.`};o.textContent=base[tool]||`Demo ${tool}: Student Hire would generate a profile-grounded answer here using the selected job, without fabricating experience.` }
function applications(){return `<section class="card"><h2>Application tracker</h2>${apps.length?`<table class="table"><tr><th>Role</th><th>Company</th><th>Fit</th><th>Status</th></tr>${apps.map(a=>`<tr><td>${a.title}</td><td>${a.company}</td><td>${a.score}%</td><td><select onchange="apps.find(x=>x.id===${a.id}).status=this.value;localStorage.setItem('sha',JSON.stringify(apps))">${["Saved","Applied","Interview","Offer","Rejected","Withdrawn"].map(x=>`<option ${x===a.status?"selected":""}>${x}</option>`).join("")}</select></td></tr>`).join("")}</table>`:`<div class="notice">No jobs tracked yet. Save a match first.</div>`}</section>`}
function feedback(){return `<section class="card"><h2>Beta feedback</h2><p>Tell us what broke, confused you, or made a match feel wrong. Weekly beta releases should be driven by this feedback.</p><textarea id="fb" placeholder="Example: This role scored 90% but conflicts with my Tuesday class."></textarea><div class="row" style="margin-top:10px"><button class="btn" onclick="localStorage.setItem('shFeedback',document.getElementById('fb').value);document.getElementById('msg').textContent='Saved — thank you.'">Send feedback</button><span id="msg" class="small"></span></div></section>`}
function why(){return `<section class="card"><div class="eyebrow">Why Student Hire</div><h2>A job board built around student constraints, not just keywords.</h2><div class="grid"><div><h3>The problem</h3><p>Generic job boards can show relevant titles while ignoring class schedules, commute, desired weekly hours, exam periods and whether a role is truly student-friendly.</p><h3>The wedge</h3><p>Student Hire combines schedule-aware matching, explainable scores and explicit feedback on why a recommendation was wrong.</p></div><div><h3>The action layer</h3><p>Once a good match appears, the AI copilot helps with resume improvement, interview prep, application answers, cover letters and skill-gap plans.</p><h3>Business model</h3><p>Students stay free. Employer revenue can come from paid postings, featured placement and premium recruiting tools, with campus partnerships later.</p></div></div></section>`}
function render(){nav();app.innerHTML=tab==="Matches"?matches():tab==="Profile"?profile():tab==="AI Coach"?ai():tab==="Applications"?applications():tab==="Feedback"?feedback():why()}
render();
</script></body></html>
